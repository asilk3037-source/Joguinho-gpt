const $=id=>document.getElementById(id);let current=0,index=0,playing=true,last=0;
animations.forEach((a,n)=>{const o=document.createElement('option');o.value=n;o.textContent='Item '+a.item+' — '+a.code;$('animation').append(o);});
function draw(){const a=animations[current];$('frame').src=a.frames[index];$('frame').alt=a.title+' — quadro '+index;$('counter').textContent='Quadro '+String(index).padStart(2,'0')+' / '+String(a.frames.length-1).padStart(2,'0');$('seek').value=index;$('toggle').textContent=playing?'Pausar':'Reproduzir';}
function select(n){current=n;index=0;playing=true;last=0;const a=animations[n];$('heading').textContent='Item '+a.item+' — '+a.title;$('details').textContent=a.code+' · '+a.frames.length+' quadros · '+a.fps+' FPS';$('animation').value=n;$('fps').value=a.fps;$('seek').max=a.frames.length-1;$('behavior').textContent=a.loop?'Ciclo contínuo.':'Ação única: para no último quadro. Use Reiniciar para rever.';draw();}
$('toggle').onclick=()=>{if(!playing&&index===animations[current].frames.length-1&&!animations[current].loop)index=0;playing=!playing;last=0;draw();};
$('restart').onclick=()=>{index=0;playing=true;last=0;draw();};
function step(d){playing=false;index=(index+d+animations[current].frames.length)%animations[current].frames.length;draw();}
$('previous').onclick=()=>step(-1);$('next').onclick=()=>step(1);
$('seek').oninput=e=>{playing=false;index=Number(e.target.value);draw();};$('animation').onchange=e=>select(Number(e.target.value));$('fps').onchange=()=>{last=0;};
$('background').onchange=e=>{const v=e.target.value;$('stage').style.backgroundImage=v==='grid'?'':'none';$('stage').style.backgroundColor=v==='grid'?'#dedede':v;};
function tick(t){const a=animations[current];if(playing){if(!last)last=t;if(t-last>=1000/Number($('fps').value)){last=t;if(index<a.frames.length-1)index++;else if(a.loop||$('reviewLoop').checked)index=0;else playing=false;draw();}}requestAnimationFrame(tick);}
select(0);requestAnimationFrame(tick);
</script></body></html>
